<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Blog · Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="main.js" defer></script></head>
<body data-page="create"><main>
<div class="form-card wide"><h1 id="heading" style="font-size:2rem">Create blog</h1>
<form id="form" novalidate><label for="title">Title</label><input id="title" type="text" maxlength="120" required>
<label for="image">Cover image link (optional)</label><input id="image" type="url" placeholder="https://example.com/photo.jpg">
<label for="content">Post</label><textarea id="content" required></textarea>
<p id="err" class="error" role="alert"></p><button id="save" class="btn" type="submit">Publish</button> <a class="btn ghost" href="dashboard.html">Cancel</a></form></div>
</main></body></html>
