<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Literata:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><script src="main.js" defer></script></head>
<body data-page="login"><main>
<div class="form-card"><h1 style="font-size:2rem">Log in</h1>
<form id="form" novalidate><label for="email">Email</label><input id="email" type="email" autocomplete="email" required>
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
<p id="err" class="error" role="alert"></p><button class="btn" type="submit">Log in</button></form>
<p>New here? <a href="register.html">Create an account</a></p></div>
</main></body></html>
